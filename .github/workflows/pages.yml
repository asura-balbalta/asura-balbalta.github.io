# GitHub Pages 배포. v 로 시작하는 태그가 push 될 때만 돈다(main push 로는 돌지 않음). 수동 실행은 Actions 탭의 Run workflow.
# 저장소 설정: Settings → Pages → Source 를 "GitHub Actions" 로. Settings → Environments → github-pages 의 배포 허용 규칙에 태그 v* 추가.
#
# 사이트 구성: /vX.Y.Z/ 는 그 태그의 앱, /latest/ 는 가장 높은 버전으로 넘김, / 는 README(소개) 페이지.
# Pages 는 배포할 때마다 사이트 전체를 바꾸므로 매번 모든 v* 태그를 다시 빌드해 함께 올린다(.github/scripts/build-site.mjs).
# 태그 하나라도 빌드에 실패하면 배포하지 않는다. 더는 올리지 않을 태그는 아래 EXCLUDE_TAGS 에 쉼표로 적는다.
name: Deploy to GitHub Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 태그마다 그 커밋을 풀어 빌드하므로 전체 이력과 태그가 필요하다
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # v* 태그마다 npm ci → npm run build 해서 site/<태그>/ 로. site/latest/ 와 site/versions.json 도 만든다
      - run: node .github/scripts/build-site.mjs site
        env:
          EXCLUDE_TAGS: ""
      # README·THIRD_PARTY 를 HTML 로 바꿔 site/index.html·readme.html·readme.en.html·third-party.html 로 넣는다(GitHub Markdown API)
      - run: node .github/scripts/render-docs.mjs site
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
