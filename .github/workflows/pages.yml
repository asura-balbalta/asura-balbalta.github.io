# GitHub Pages 배포. v 로 시작하는 태그가 push 될 때만 돈다(main push 로는 돌지 않음). 수동 실행은 Actions 탭의 Run workflow.
# 저장소 설정: Settings → Pages → Source 를 "GitHub Actions" 로. Settings → Environments → github-pages 의 배포 허용 규칙에 태그 v* 추가.
name: Deploy to GitHub Pages

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci          # postinstall 이 patches/ 를 적용한다
      - run: npm run build   # prebuild 가 rhino3dm 을 dist/export/ 로 복사한다
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
